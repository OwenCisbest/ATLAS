name: Build ATLAS for Windows

on:
  push:
    branches: [main, work]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Test, package and launch on Windows
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Test and package; launch the extracted application without API keys
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload downloadable Windows distribution
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Windows-x64
          path: |
            dist/ATLAS-Windows-x64.zip
            dist/ATLAS-Windows-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ATLAS-Windows-validation
          path: build/validation/
          if-no-files-found: warn
          retention-days: 30
      - name: Explain the download
        shell: pwsh
        run: |
          @'
          ## Windows build passed
          The extracted standalone application launched on this Windows runner with no API keys and no Python on PATH. It loaded local WebEngine content, rendered a native graph, exported a PDF and initialized SQLite.
          Download **ATLAS-Windows-x64** below. Extract the artifact download, then extract the enclosed **ATLAS-Windows-x64.zip**. Open **ATLAS/ATLAS.exe** and keep **_internal** beside it.
          This automated runner check does not replace Windows 11 hardware, accessibility or live API testing.
          '@ >> $env:GITHUB_STEP_SUMMARY
