[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-research"
version = "0.1.0"
description = "Source-backed public research desktop workspace"
requires-python = ">=3.12"
dependencies = ["PySide6>=6.8,<7", "SQLAlchemy>=2.0,<3", "pydantic>=2.10,<3", "httpx>=0.28,<1", "reportlab>=4.2,<5", "keyring>=25,<26", "platformdirs>=4,<5"]

[project.optional-dependencies]
dev = ["setuptools>=75", "pytest>=8,<10", "pytest-qt>=4.4,<5", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "pyinstaller>=6.11,<7", "pypdf>=5,<7"]

[project.scripts]
atlas = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.setuptools.package-data]
"app.reports" = ["fonts/*.ttf", "fonts/LICENSE.txt"]
